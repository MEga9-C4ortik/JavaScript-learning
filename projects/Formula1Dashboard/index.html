<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg" type="image/svg+xml">
    <title> F1 Dashboard </title>
</head>

<aside class="rightSidebar">
    <h3>Quick Stats</h3>
    <div class="stat-card">
        <p class="stat-label">Championship Leader</p>
        <p class="stat-value">Lando Norris </p>
        <p class="stat-detail">390 points</p>
    </div>

    <div class="stat-card">
        <p class="stat-label">Next Race</p>
        <p class="stat-value" id="nextRace">Loading...</p>
        <p class="stat-detail" id="countdown">...</p>
    </div>

    <div class="stat-card">
        <p class="stat-label">Last Winner</p>
        <p class="stat-value"> Max Verstappen</p>
        <p class="stat-detail">Las vegas</p>
    </div>
</aside>

<body>
    <header class="header">
        <button id="hamburgerButton" class="hamburger"> ☰ </button>
        <h1>F1 Dashboard</h1>
    </header>

    <div class="overlay" id="overlay"></div>

    <div id="sidenav" class="sidenav">
        <div class="sidenavContent">
            <ul class="sidenavList" id="sidenavList">
                <li><button class="sidenavListItem" data-section="driversStandings"> Drivers Standings </button></li>
                <li><button class="sidenavListItem" data-section="teamsStandings"> Teams Standings </button></li>
                <li><button class="sidenavListItem" data-section="schedule"> Schedule </button></li>
                <li><button class="sidenavListItem" data-section="results"> Results </button></li>
            </ul>
        </div>

    </div>

    <main id="mainContent" class="mainContent">
        <section id="driversStandings" class="contentSection">
            <h2> Drivers Standings </h2>
            <hr>
            <div id="driversData"></div>
        </section>

        <section id="teamsStandings" class="contentSection" style="display: none">
            <h2> Teams Standings </h2>
            <hr>
            <div id="teamsData"></div>
        </section>

        <section id="schedule" class="contentSection" style="display: none">
            <h2> Schedule </h2>
            <hr>
            <div id="scheduleData"></div>
        </section>

        <section id="results" class="contentSection" style="display: none">
            <h2> Results </h2>
            <hr>
            <div id="resultsData"></div>
        </section>
    </main>
</body>
</html>
