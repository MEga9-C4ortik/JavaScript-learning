<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> F1 Dashboard </title>
</head>
<body>
    <div class="header">
        <button id="hamburgerButton"> ☰ </button>
        <h1>F1 Dashboard</h1>
    </div>

    <div id="sidenav" class="sidenav" style="display: none">
        <overlay id="overlay"> </overlay>
        <div class="sidenavContent">
            <ul>
                <li> Drivers Standings</li>
                <li> Teams Standings</li>
                <li> Schedule </li>
                <li> Results </li>
            </ul>
        </div>
        <button id="sidenavCloseButton"> × </button>
    </div>

    <div id="mainContent">
        <section id="driversStandings">

        </section>
        <section id="teamsStandings" style="display: none">

        </section>
        <section id="schedule" style="display: none">

        </section>
        <section id="results" style="display: none">

        </section>
    </div>
</body>
</html>
