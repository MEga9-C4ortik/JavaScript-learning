<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Special for my sister</title>
</head>
<body>
    <nav class="navbar">
        <button id="wardrobeButton"> Wardrobe </button>
        <button id="generatorButton"> Generate </button>
        <button id="savedButton"> Saved </button>
    </nav>

    <section id="wardrobe">
        <h1 id="wardrobe-h1"> My wardrobe </h1>
        <button id="addButton"> + </button>
        <div id="clothesList"></div>
    </section>

    <section id="generator" style="display: none">
        <h1> Generator </h1>
        <button id="generateButton"> Generate </button>
    </section>

    <section id="saved" style="display: none">
        <h1> Saved outfits </h1>
        <div id="savedOutfits"></div>
    </section>

    <div id="modal" class="modal" style="display: none">
        <div class="modal-content"></div>
        <div class="modal-overlay"></div>
        <form id="addForm">
            <input id="clothesName" type="text" name="clothesName" placeholder="Clothes" required>
            <select id="clothesType" name="clothesType" required>
                <option value="" disabled selected>Clothes</option>
                <option value="head"> Head </option>
                <option value="upperBody"> Upper Body </option>
                <option value="lowerBody"> Lower Body </option>
                <option value="dress"> Dress </option>
                <option value="shoes"> Footwear </option>
                <option value="Accessories"> Accessories </option>
            </select>
            <input type="checkbox" id="styles" name="styles" required>
            <label for="styles"> Casual </label>
            <label for="styles"> Smart casual </label>
            <label for="styles"> Sport </label>
            <label for="styles"> Formal </label>
            <label for="styles"> Elegant </label>
            <input type="color" required>

            <input type="submit">
            <input type="button" id="cancelButton" value="Cancel">

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
